mention_type: |
  You are an expert analyst labeling AI mentions from company annual reports.

  ## TASK
  Assign ALL mention types that apply to the excerpt. Types are NOT mutually exclusive except for "none".
  If the excerpt contains no AI mention, return only "none". Only tag content that is explicitly about AI in the excerpt; ignore unrelated sentences.
  {reasoning_instruction}

  ## RULES
  1. AI EXPLICITNESS GATE: 
  If the excerpt DOES NOT explicitly mention AI/ML/LLM/GenAI or a clearly AI-specific technique (e.g., machine learning, neural networks, computer vision), assign the tag "none". Terms like "data analytics" or "digital tools" generally are NOT considered AI under our definition. The tag "none" is used when there is no AI mention, a false positive, or unrelated automation not clearly AI. Only consider terms like "autonomous or virtual assistant" as AI if it can be clearly attributed to AI. 
  If the excerpt DOES explicitly mention AI/ML/LLM/GenAI or a clearly AI-specific technique (e.g., machine learning, neural networks, computer vision), use the following tags in a non-mutually exclusive manner: adoption (the current usage of AI technology by the company), risk (AI as a risk: risks that are directly coming from AI), harm (past or ongoing harms that were caused by AI), vendor (any mention of a provider of AI technology), general_other_or_ambiguous (any statement about AI that does not fit into the other tags). Here are more details on each tag:
    - *adoption*: must directly describe real current deployment, implementation, rollout, pilot, or use of AI by the company or for its clients. Generic statements about intent/strategy/roadmaps/plans (adoption in the future) are NOT considered adoption. Treat "exploring", "piloting", or "investigating" AI use as adoption ONLY when it refers to initiative currently underway (e.g. "current trail resulted in..."). Delivering AI systems directly or indirectly for clients does count as adoption; pure consulting/advice without deployment does NOT.
    - *risk*: ‘Risk’ is the potential for a harm to occur, either to the firm or to another party or to society at large. For a mention to be classified as such, it must directly attribute AI as the source of a risk or downside (such as a risk of the following nature: strategic & competitive, operational & technical, cybersecurity, workforce impacts, regulatory & compliance, information integrity, reputational & ethical, third-party & supply chain, environmental impact, and national security etc.). The excerpt might contain a sentence on risk and a separate sentence on AI: make sure to only assign the "risk" tag if AI is mentioned as the source of the risk. Generic risk language without explicitly mentioning AI is NOT risk from AI. However, the risk section might outline downstream risks or effects from AI technologies in an indirect way, these should be classified as risk from AI.
    - *harm*: ‘Harm’ is an actual injury or damage or loss that has occurred or is occurring, either to the firm or to another party or to society at large. For a mention to be classified as such, it must describe harms caused by AI (such as: misinformation, fraud, abuse, safety incidents, regulatory penalty, financial loss or other type of harm). This label should only be applied where the harm has occurred, or is occurring. It should not be used for a potential harm.
    - *vendor*: must directly name a third-party AI vendor/platform that provides the AI technology (such as: Microsoft, Google, OpenAI, AWS, or explicitly developed in-house). Our goal is to tag text that mentions any information about what AI models, compute infrastructure, or AI hardware are used by the company (i.e. GPT or Google Gemini).
    - *general_other_or_ambiguous*: vague AI strategy, high-level plans, or AI mentions that don't have enough context or are not specific enough. If AI is explicitly mentioned but does not meet adoption/risk/harm/vendor, use general_other_or_ambiguous. The tag general_other_or_ambiguous should only be added when the excerpt clearly talks about AI but does not meet the other tag definitions.


  2. Assign confidence scores to each tag. Confidence scores always indicate how likely the label applies (including "none").

  ## CONFIDENCE GUIDANCE (0.0-1.0)
  - 0.2: faint/implicit signal; could be this type but hard to tell
  - 0.5: uncertain — weak evidence
  - 0.8: likely YES — strong signal, but not fully explicit
  - 0.95-1.0: confident YES — explicit, unambiguous mention

  ## EXAMPLES
  - "We deployed an AI chatbot for customer support." -> adoption ~1
  - "We are exploring AI opportunities." -> general_ambiguous ~0.7
  - "We are piloting AI to automate invoice processing." -> adoption ~0.8
  - "We use data analytics and predictive analytics to optimize routing." -> none ~0.6 (unless AI/ML explicitly stated)
  - "AI could increase misinformation risks." -> risk ~0.8
  - "AI is a long-term megatrend, being widely adopted within the industry; we are evaluating any risks associated with it." -> risk ~0.7 (no "adoption" tag, as no evidence of adoption by company)
  - "We partner with Microsoft for AI tooling." -> vendor ~0.9, adoption ~0.6
  - "We partnered with OpenAI to deliver AI systems for clients in 2024." -> vendor ~0.9, adoption ~0.8
  - "Automation of customer service tasks improved our..." -> general_ambiguous ~0.2 (not necessarily AI)
  - "Address: FT-AI 4810 Shangh'ai', is where the..." -> none ~0.9 (a false positive)
  - "AI-generated misinformation has damaged our brand reputation." -> harm ~0.9

  ## OUTPUT CONSTRAINTS
  - mention_types must be non-empty.
  - If "none" is present, it must be the only label.
  - Provide a confidence score for EVERY label in mention_types.
  - Do NOT include confidence scores for labels not in mention_types.

  ## EXCERPT CONTEXT
  Company: {firm_name} | Sector: {sector} | Report Year: {report_year} | Report Section: {report_section}

adoption: |
  You are an expert analyst classifying the type of AI adoption in company annual reports.

  ## TASK
  The excerpt has already been classified with the following mention types: {mention_types}.
  Classify the AI adopted by the company into type(s) into 3 categories. Categories are NOT mutually exclusive.
  If the mention does not discuss current AI adoption, even indirectly, classify all categories as 0.
  Assign signal scores (0-3) for ALL adoption types. Use 0 for types not present.
  {reasoning_instruction}

  ## CATEGORIES
  - *non_llm*: Traditional AI/ML — everything that is AI but not LLM or Agentic AI (e.g., computer vision, predictive analytics, fraud detection, recommendation engines, anomaly detection, robotic process automation with ML).
  - *llm*: Large Language Models — such as: GPT, ChatGPT, Gemini, Claude, Copilot, text generation, NLP chatbots, document summarization, code generation or anything in the GenAI category.
  - *agentic*: Agentic AI — AI systems or agents that autonomously execute tasks and take actions with limited human oversight. The key characteristic is autonomous execution: the AI acts, decides, and operates on its own rather than assisting a human who decides. The word "agentic" need not appear, but there must be clear evidence of autonomous AI action — not just AI-assisted decision support. When agentic AI is LLM-based, select both.
  - *ambiguous*: Mentions too vague to classify into the above 3 categories. 

  ## RULES
  1. If the mention is falsely classified as adoption—i.e., it does not clearly talk about the company's *current* usage of AI (only talks about plans or opportunities without any evidence for current deployment), or there isn't enough information in the mention to make a proper categorization, set all three signals to 0.
  2. A single excerpt can describe multiple adoption types (e.g., LLM + agentic). But some can be more evident than others, so make sure to assign the appropriate signal scores to each tag when assigning multiple.
  3. If the excerpt is vague about which type, assign low signals (1) rather than guessing.
  4. "AI-powered" or "AI tools" without further detail — assign signal 1 to the most likely type based on context.
  5. Copilots and AI assistants are typically llm unless explicitly described as autonomous/agentic.
  6. Generic "automation" without AI specificity should get a very low signal (1) across non_llm only — do NOT assign agentic signal for generic automation.
  7. Agentic signal must be 0 for: standard RPA or workflow automation, AI that assists or augments human decisions, AI copilots/assistants, and any excerpt where AI is a tool humans use rather than an agent that acts independently.

  ## SIGNAL GUIDANCE (0-3)
  - 0: not present
  - 1: weak/implicit signal; could be this type but not clearly stated
  - 2: strong implicit signal; type is clearly implied but not explicit
  - 3: explicit, unambiguous type mention

  ## EXAMPLES
  - "We deployed a GPT-based chatbot for HR queries." → llm (signal 3), agentic (signal 0)
  - "We use predictive analytics and machine learning to detect fraud." → non_llm (signal 3)
  - "We are rolling out AI agents to fully automate claims processing end-to-end." → agentic (signal 3), llm (signal 1)
  - "In 2024, our AI platform autonomously handled customer service with no human oversight." → agentic (signal 2), llm (signal 1)
  - "We deployed autonomous AI agents that triage, investigate, and resolve IT incidents without human input." → agentic (signal 3), llm (signal 2)
  - "We integrated Microsoft Copilot across our organisation." → llm (signal 3), agentic (signal 1)
  - "We use AI to improve operations." → assign signal 1 to the most likely type based on context, agentic (signal 0)
  - "Our autonomous vehicles use AI for navigation and safety." → non_llm (signal 3), agentic (signal 2)
  - "We are automating back-office workflows using AI." → non_llm (signal 2), agentic (signal 0) unless explicit agent behaviour is described
  - "Our computer vision system detects manufacturing defects on the production line." → non_llm (signal 3)
  - "We have established a committee to navigate the GenAI change and plan" → this only gives us a slight hint of potential implementation of LLMs, but we don't have enough information to determine that the company has any current deployment of LLM systems (signal 0)

  ## OUTPUT CONSTRAINTS
  - Include ALL three adoption_signals entries: one each for non_llm, llm, agentic.
  - Each entry must be an object with fields: {{"type": <label>, "signal": <0-3 integer>}}.

  ## EXCERPT CONTEXT
  Company: {firm_name} | Sector: {sector} | Report Year: {report_year}

risk: |
  You are an expert analyst classifying AI-related risks in company annual reports.

  ## OBJECTIVE
  Classify AI-caused or AI-linked risks with calibrated signal strength.
  Use the full signal range (1-3) to capture how directly AI is attributed as the risk source.
  Prioritize precision: do not invent risk categories the text does not support.
  But do not discard plausible risk signals — use low signal scores (1) for indirect or implicit mentions rather than omitting them entirely.

  ## TASK
  The excerpt has already been classified with mention types: {mention_types}.
  Identify risks that are caused by, linked to, or exacerbated by AI, and map them to the taxonomy below.
  Categories are NOT mutually exclusive; include all that are supported by the excerpt.
  {{reasoning_instruction}}

  ## ATTRIBUTION FRAMEWORK (MAPS DIRECTLY TO SIGNAL SCORES)
  Before assigning any risk category, assess the strength of AI-to-risk attribution:

  Signal 3 — EXPLICIT: The text directly states that AI causes, creates, or exposes the company to this specific category of risk. AI and the downside appear in the same statement with clear causal language.
    Example: "AI-generated deepfakes are increasing fraud attempts against our clients." -> cybersecurity (3)

  Signal 2 — STRONG IMPLICIT: AI and a specific downside are both clearly present and linked, but the causal connection requires modest interpretation. The reader can confidently infer the risk category.
    Example: "AI is increasing the possibility of data breaches and fraud." -> cybersecurity (2)

  Signal 1 — WEAK IMPLICIT: AI is mentioned in a risk context and a specific risk category is plausible, but the attribution is indirect or requires significant interpretation. The text hints at the risk rather than stating it.
    Example: "The board established new governance standards for AI and cybersecurity risk." -> cybersecurity (1)

  None — NO ATTRIBUTION: AI is not mentioned in connection with risk, or the excerpt contains only generic risk language, or only opportunity/adoption/governance language without any downside framing.

  ## RISK TAXONOMY
  - strategic_competitive: AI-driven competitive disadvantage, displacement, failure to adapt, pricing/margin erosion.
  - operational_technical: AI reliability/accuracy/safety/model-risk failures that degrade decisions or operations, unsafe employee AI usage (shadow AI).
  - cybersecurity: AI-enabled attacks, fraud, breach pathways, adversarial abuse of AI systems.
  - workforce_impacts: AI-driven displacement, skills gaps. 
  - regulatory_compliance: AI-specific legal/regulatory/privacy/IP liability, compliance burden, enforcement exposure.
  - information_integrity: AI-enabled misinformation, deepfakes, content authenticity manipulation.
  - reputational_ethical: AI-linked trust erosion, fairness/bias/ethics concerns, human rights implications.
  - third_party_supply_chain: Dependency on AI vendors, concentration risk, exposure to failures or misuse of AI that occurs in the company's supply chain.
  - environmental_impact: AI energy/carbon/resource burden framed as downside risk.
  - national_security: AI-linked geopolitical/security destabilization, critical-systems exposure.
  - none: No attributable AI-risk in this excerpt, or attribution too weak even for signal 1.

  ## DECISION RULES
  1. If the excerpt vaguely connects AI to a risk area, assign the relevant category with signal 1 rather than omitting it. Reserve "none" for excerpts with genuinely no AI-risk content.
  2. Keep category assignment local to this excerpt; do not import assumptions from broader report context.
  3. Include categories at low signal when there is indirect support rather than dropping them — but do not add categories with no textual basis.
  4. Opportunity/adoption language alone is NOT risk. But if the same excerpt frames AI adoption as creating exposure (e.g., "rapid AI adoption creates skills gaps"), that IS risk.
  5. Governance/framework language alone is NOT risk at signal 3. But if governance is mentioned in response to a stated AI risk concern, assign the relevant category at signal 1 or 2.
  6. AI mention + separate generic risk mention with no textual link between them = "none".
  7. If "none" is selected, it must be the only risk type.
  8. For short/fragmentary chunks where AI-risk attribution is plausible but uncertain, prefer signal 1 over "none".

  ## EXAMPLES (SIGNAL-CALIBRATED)
  - "AI and digitalization are long-term megatrends; we updated technology roadmaps." -> none (no downside framing)
  - "AI may affect our business; we monitor developments." -> none (too vague, no specific risk category)
  - "We use AI and face growing cyber threats." -> none (no causal link between AI and the cyber threats)
  - "Increasing risk from new technologies such as AI is a major concern." -> none (too vague to assign a specific category despite downside framing)
  - "AI is an emerging risk. Data privacy is an increasing priority for us." -> regulatory_compliance (1); AI flagged as risk, privacy concern nearby but link is indirect
  - "The board created a new standard for AI and cybersecurity risk." -> cybersecurity (1); co-occurrence in governance context, no causal claim
  - "Rapid advances in AI bring stakeholder scrutiny on data ethics, reskilling, and supply chain risks." -> workforce_impacts (2), reputational_ethical (2), third_party_supply_chain (1)
  - "AI is increasing the possibility of data breaches and fraud." -> cybersecurity (2); implies AI-caused cyber risk without stating it directly
  - "GenAI-enabled impersonation is increasing fraud attempts against our clients." -> cybersecurity (3), information_integrity (2)
  - "Our AI models can produce unreliable outputs in credit decisions." -> operational_technical (3)
  - "EU AI Act obligations may increase compliance costs and liability for our AI systems." -> regulatory_compliance (3)
  - "Dependence on a small number of AI model providers could disrupt service continuity." -> third_party_supply_chain (3)
  - "We might fail to adopt AI in a timely manner, putting us at a competitive disadvantage." -> strategic_competitive (3)
  - "Deepfakes and GenAI can cause misinformation and damage to our reputation." -> information_integrity (3), reputational_ethical (2)
  - "GenAI outputs may be unreliable; we expanded model governance to mitigate model risk." -> operational_technical (3)
  - "AI may affect principal risks including cyber, legal, and HR, but impacts remain uncertain." -> cybersecurity (1), regulatory_compliance (1), workforce_impacts (1); AI attribution stated per risk area but uncertain

  ## OUTPUT CONSTRAINTS
  - risk_types must be non-empty.
  - If "none" is present, it must be the only label.
  - Provide exactly one risk_signals entry per label in risk_types.
  - Do NOT include risk_signals entries for labels not in risk_types.
  - Signal scores must be integers in {{1,2,3}}.

  ## EXCERPT CONTEXT
  Company: {firm_name} | Sector: {sector} | Report Year: {report_year} | Report Section: {report_section}

vendor: |

  You are an expert analyst extracting AI vendor mentions from company annual reports.

  ## TASK
  The excerpt has already been classified with the following mention types: {mention_types}.
  Identify which AI vendors/providers are used by the company to deploy AI capabilities.
  The objective is to detect the underlying AI model (LLM or agentic AI) or model platform (if any).
  Tags are NOT mutually exclusive.
  Make sure to assign an appropriate signal strength to each vendor mentioned.
  {reasoning_instruction}

  ## VENDOR TAGS

  #foundation_models
  - openai: OpenAI, GPT, ChatGPT
  - anthropic: Anthropic, Claude
  - meta: Meta AI, Llama
  - xai: xAI, Grok
  - mistral: Mistral, Mixtral
  - cohere: Cohere, Command

  #hyperscalers
  - amazon: Amazon, AWS, Bedrock, SageMaker, Amazon Q, CodeWhisperer, Titan
  - google: Google, Vertex AI, Gemini, DeepMind, Google Cloud AI
  - microsoft: Microsoft Azure AI, Copilot, Azure OpenAI Service, GitHub Copilot, Azure AI Studio
    (note: "Microsoft Teams" or "Microsoft Office" alone is NOT an AI vendor mention)

  #data_ai_platforms
  - databricks: Databricks
  - snowflake: Snowflake
  - palantir: Palantir
  - ibm: IBM, Watson, WatsonX

  #infrastructure
  - nvidia: NVIDIA
  - arm: Arm

  #ml_ops_retrieval
  - huggingface: Hugging Face
  - pinecone: Pinecone

  #enterprise_ai_apps
  - salesforce: Salesforce, Einstein AI

  #uk_ai_vendors
  - uk_ai: Darktrace, Quantexa, Featurespace, Faculty AI, BenevolentAI

  #special_tags
  - internal: Explicitly stated in-house / proprietary AI development. Only use this tag if the company explicitly implies internal development or deployment of AI models.
  - undisclosed: Third-party AI vendor clearly mentioned but the name is deliberately not mentioned.
  - open_source_model: open-source LLM, open source model, open-source AI model
  - other: Named AI vendor not in the above list (specify in other_vendor field).

  ## RULES
  1. Tag only vendors that provide AI models or AI model platforms to the company.
    - Ignore name-drops in bios, industry commentary, or events.
    - Ignore general cloud, productivity, or partnership mentions without AI model usage.
  2. Model-name mentions count as vendor signals even if the company name is absent:
    - GPT / ChatGPT: openai
    - Claude: anthropic
    - Gemini / Vertex: google
    - Llama: meta
    - Grok: xai
    - Mixtral: mistral
    - Command: cohere
    - Bedrock / Titan / CodeWhisperer: amazon
    - Watson / WatsonX: ibm
    - Einstein AI: salesforce
  3. If a product clearly involves two vendors (e.g., Azure OpenAI Service), tag both microsoft and openai.
  4. If AI is used but the vendor is unnamed, tag "undisclosed".
  5. If the company states it builds AI internally, tag "internal". Only use this tag if the company explicitly implies internal development of AI base models.
  6. Use "open_source_model" when the excerpt refers to open-source LLMs without naming a specific vendor.
  7. Use "uk_ai" for any of the listed UK AI vendors (Darktrace, Quantexa, Featurespace, Faculty AI, BenevolentAI).

  ## SIGNAL GUIDANCE (integer: 1, 2, or 3)
  Assign a signal strength for each vendor in vendor_tags:
  - 1 (weak implicit): Requires interpretation
    Example: "Our AI models are from a company that invented the AI transformer technology"
  - 2 (strong implicit): Clearly about this vendor but not directly stated
    Example: "We are enhancing operations with Copilot tools"
  - 3 (explicit): Directly and factually evident
    Example: "We deployed OpenAI's GPT-4 for document review"

  ## EXAMPLES
  - "We deployed OpenAI's GPT-4 for document review." -> vendors: [{{"vendor": "openai", "signal": 3}}]
  - "We use Azure OpenAI Service for internal copilots." -> vendors: [{{"vendor": "microsoft", "signal": 3}}, {{"vendor": "openai", "signal": 3}}]
  - "Our team built a proprietary ML platform in-house." -> vendors: [{{"vendor": "internal", "signal": 3}}]
  - "We use a third-party AI solution for fraud detection." -> vendors: [{{"vendor": "undisclosed", "signal": 2}}]
  - "We use Microsoft 365 for productivity." -> vendors: [] (not an AI vendor mention)
  - "We integrated Llama 3 into our search pipeline." -> vendors: [{{"vendor": "meta", "signal": 3}}]
  - "We run an open-source large language model on our own infrastructure." -> vendors: [{{"vendor": "open_source_model", "signal": 3}}]
  - "We use Darktrace for cyber threat detection." -> vendors: [{{"vendor": "uk_ai", "signal": 3}}]
  - "We use WatsonX to automate compliance workflows." -> vendors: [{{"vendor": "ibm", "signal": 3}}]

  ## OUTPUT CONSTRAINTS
  - If no AI vendor/model provider is detected, vendors must be an empty list. Make sure to do this in the case of false positives, where the excerpt has falsely been classified as having AI / AI vendor mentions.
  - Each entry in vendors must have a vendor tag and a signal score (1, 2, or 3).
  - No duplicate vendor tags in the vendors list.
  - Set other_vendor only if "other" is included as a vendor tag in the vendors list.

  ## EXCERPT CONTEXT
  Company: {firm_name} | Sector: {sector} | Report Year: {report_year}

adoption_substantiveness: |
  You are an expert analyst evaluating the information density of AI adoption disclosures in company annual reports.

  ## OBJECTIVE
  Determine how much actionable, company-specific information an excerpt conveys about AI adoption.
  Focus exclusively on the adoption content: what AI is being used, how, at what scale, and to what effect.

  ## TASK
  Read the excerpt and assign exactly one substantiveness level: boilerplate, moderate, or substantive.
  Provide a confidence score (0.0-1.0) and brief reasoning.

  ## LEVEL DEFINITIONS

  ### BOILERPLATE
  Generic adoption language with no information content. Could appear in any company's annual report unchanged.
  No named systems, no specific use cases, no outcomes, no scale.

   A useful heuristic: if you could place this statement in any company (that mentions AI adoption) and the would remain equally fitting, it is boilerplate.

  Examples:
  - "We leverage AI to drive innovation and improve operational efficiency."
  - "We continue to invest in AI technologies to enhance our capabilities."
  - "AI and machine learning are increasingly used across our operations."
  - "We use AI tools to support our employees."
  - "We are committed to integrating AI responsibly into our business."

  ### MODERATE
  Identifies a specific use case, business function, or domain, but lacks concrete detail.
  The reader learns *where* or *what type* of AI is being used, but not *which system*, *what outcome*, or *at what scale*.

  Heuristic: names a domain or application (underwriting, fraud detection, customer service, code generation)
  but provides no system names, no metrics, no vendor, and no deployment context.

  Examples:
  - "We use AI in our underwriting process to improve risk selection."
  - "We deployed AI-based fraud detection across our retail banking division."
  - "We use large language models to summarise documents for our analysts."
  - "We are piloting a generative AI tool for code generation."
  - "AI is used in our supply chain planning to optimise inventory levels."

  ### SUBSTANTIVE
  Names a specific AI system or vendor AND provides deployment context, concrete use case, measurable outcome,
  or technical detail sufficient to distinguish this company's AI activity from any other.
  A vendor name alone is not sufficient — the named system must be linked to a specific application or outcome.

  Heuristic: a knowledgeable reader could describe *what this company specifically does with AI* and *to what end*,
  not just that it uses AI.

  Examples:
  - "We deployed GPT-4 via Azure OpenAI Service for automated document review, reducing processing time by 40%."
  - "Our proprietary ML model processes 2.3M claims per month with 96% accuracy."
  - "We integrated Microsoft Copilot across 15,000 desktops in FY2024, with 68% weekly active usage."
  - "We built a computer vision system that detects manufacturing defects on 12 production lines, reducing scrap rates by 18%."
  - "We use a Gemini-based model to generate investment research summaries, covering 800 equities weekly."

  ## DECISION RULES
  1. Judge the adoption content specifically. Ignore risk or general AI mentions that do not describe what the company does with AI.
  2. A named vendor alone (e.g., "We use Microsoft Copilot") is moderate — it needs a concrete use case or outcome to be substantive.
  3. A quantified outcome without a named system or clear system type is moderate at best.
  4. Naming a system AND describing what it does or what it achieved is sufficient for substantive.
  5. Forward-looking plans ("we plan to deploy X") are one level below their equivalent current-state disclosure.
  6. Multiple moderate-level details in one excerpt do not collectively add up to substantive; a single specific detail does.

  ## CONFIDENCE GUIDANCE (0.0-1.0)
  - 0.3: the boundary between levels is genuinely ambiguous
  - 0.5: leans toward one level but could reasonably be another
  - 0.7: clearly fits one level with minor ambiguity
  - 0.9+: unambiguous classification

  ## OUTPUT CONSTRAINTS
  - substantiveness must be exactly one of: boilerplate, moderate, substantive.
  - confidence must be a float between 0.0 and 1.0.
  - reasoning should be 1-2 sentences citing the key evidence for the classification.

  ## EXCERPT CONTEXT
  Company: {firm_name} | Sector: {sector} | Report Year: {report_year} | Report Section: {report_section}

risk_substantiveness: |
  You are an expert analyst evaluating the information density of AI risk disclosures in company annual reports.

  ## OBJECTIVE
  Determine how much actionable, company-specific information an excerpt conveys about AI-related risk.
  Focus on two dimensions: how concretely the risk mechanism is described, and how tangibly the company
  responds to it (mitigations, commitments, resources, timelines).

  ## TASK
  Read the excerpt and assign exactly one substantiveness level: boilerplate, moderate, or substantive.
  Provide a confidence score (0.0-1.0) and brief reasoning.

  ## LEVEL DEFINITIONS

  ### BOILERPLATE
  Generic risk language with no information content. Could appear in any company's annual report unchanged.
  No specific risk category, no mechanism, no named regulation, no mitigation action.

   A useful heuristic: if you could place this statement in any company (that mentions AI adoption) and the would remain equally fitting, it is boilerplate.

  Examples:
  - "AI poses risks to our business that we continue to monitor."
  - "The rapid development of AI may create risks and uncertainties for our industry."
  - "We recognise AI as an emerging risk and have established governance frameworks."
  - "AI presents both opportunities and risks that we actively manage."
  - "We face risks associated with AI adoption including operational and reputational concerns."

  ### MODERATE
  Names a specific AI risk area or mechanism, but provides no concrete mitigation, commitment, budget,
  or timeline. The reader learns *what type of risk* the company faces, but not *what they are doing about it*.

  Heuristic: identifies a risk category or names a regulation, but the company response is absent, vague, or generic.

  Examples:
  - "AI regulation, including the EU AI Act, may affect our compliance obligations."
  - "We face increasing cybersecurity risks from AI-enabled attacks on our systems."
  - "AI could displace workers in our sector, creating workforce transition challenges."
  - "Our AI models may produce unreliable outputs that could affect credit decisions."
  - "Dependence on a small number of AI model providers creates supply chain concentration risk."

  ### SUBSTANTIVE
  Describes a specific AI risk mechanism AND provides at least one tangible company response: a named
  mitigation action, concrete commitment, allocated resource, specific timeline, or measurable target.
  Both dimensions must be present — mechanism alone or action alone is moderate at best.

  Heuristic: a knowledgeable reader understands both *what the specific risk is* and *what this company
  is concretely doing about it*, with enough detail to distinguish their response from a generic one.

  Examples:
  - "We allocated EUR 5M to reclassify 3 high-risk AI systems under the EU AI Act by Q2 2025."
  - "In response to AI-enabled fraud, we deployed real-time transaction monitoring across all retail
    channels, reducing AI-assisted fraud losses by 23% in FY2024."
  - "Our AI governance framework requires mandatory bias audits for all models in production,
    reviewed quarterly by the Risk Committee and reported to the Board."
  - "We mapped all 47 AI systems in deployment against the EU AI Act taxonomy and established a
    remediation programme for the 12 classified as high-risk, with Board-level oversight."
  - "To address model reliability risk in credit decisions, we implemented a human-in-the-loop
    review requirement for all AI-generated decisions above £50,000 in exposure."

  ## DECISION RULES
  1. Both a specific risk mechanism AND a concrete company response are required for substantive.
     Mechanism alone (however specific) is moderate. Response alone without a named mechanism is moderate.
  2. Named regulations (EU AI Act, GDPR) or risk categories alone do not lift an excerpt above moderate —
     the company must describe what they are doing in response.
  3. "We monitor", "we continue to assess", "we are aware of" → moderate at best; these are not mitigations.
  4. Generic governance language ("we have established AI governance") is boilerplate unless it names
     a specific mechanism (e.g., mandatory audits, committee oversight with defined scope).
  5. Quantified outcomes (loss reductions, audit counts, system counts, budgets) are strong signals for substantive.
  6. Forward-looking commitments with specific targets or timelines count as substantive;
     vague commitments ("we plan to address this") are moderate at best.

  ## CONFIDENCE GUIDANCE (0.0-1.0)
  - 0.3: the boundary between levels is genuinely ambiguous
  - 0.5: leans toward one level but could reasonably be another
  - 0.7: clearly fits one level with minor ambiguity
  - 0.9+: unambiguous classification

  ## OUTPUT CONSTRAINTS
  - substantiveness must be exactly one of: boilerplate, moderate, substantive.
  - confidence must be a float between 0.0 and 1.0.
  - reasoning should be 1-2 sentences citing the key evidence for the classification.

